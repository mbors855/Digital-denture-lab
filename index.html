</style></head><body><canvas id="game"></canvas><div id="hud"><div id="mission"><b>🦷 DIGITAL DENTURE LAB</b><span id="objective"></span></div><div id="status">Opdracht 001<br><span id="progress">0 / 6</span> stappen</div></div><div id="toast"></div><div id="touchstate" style="position:absolute;top:68px;left:9px;z-index:4;font-size:11px;color:#a6f6d2;pointer-events:none">Raak de joystick aan</div><div id="hint">Links: lopen · Rechts: rondkijken · ACTIE: machine gebruiken</div><div id="controls"><div id="stick"><div id="nub"></div></div><div id="right"><div id="look">↔<br>KIJK<br>ROND</div><button id="act">ACTIE</button></div></div><div id="modal"><div id="panel"><h2 id="mt"></h2><p id="md"></p><button id="confirm">Uitvoeren</button><button id="close" style="background:#26364b">Terug</button></div></div><script>

let px=8,py=5.8,angle=-Math.PI/2,step=0,done=false,near=-1,toastUntil=0,toast='';const objectives=['Lees de patiëntopdracht bij het bord','Scan het model met de 3Shape scanner','Ontwerp de prothese in CAD','Print de try-in op de Asiga','Reinig en hard de print uit','Werk af en controleer de prothese','Opdracht afgerond!'];function updateHUD(){document.getElementById('objective').textContent=objectives[Math.min(step,6)];document.getElementById('progress').textContent=step+' / 6'}updateHUD();function solid(x,y){return map[Math.floor(y)]?.[Math.floor(x)]!=='0'}function move(dx,dy){if(!solid(px+dx,py))px+=dx;if(!solid(px,py+dy))py+=dy}

const modal=document.getElementById('modal');let selected=-1;function interact(){if(modal.style.display==='flex')return;if(near<0){showToast('Loop dichter naar een werkstation');return}selected=near;let m=machines[selected];document.getElementById('mt').textContent=m.emoji+' '+m.name;document.getElementById('md').textContent=m.desc+(selected!==step?'\n\nDeze werkplek is nog niet aan de beurt.':'');document.getElementById('confirm').textContent=selected===step?'Werkstap uitvoeren':'Bekijk werkplek';modal.style.display='flex'}document.getElementById('act').onclick=interact;document.getElementById('close').onclick=()=>modal.style.display='none';document.getElementById('confirm').onclick=()=>{modal.style.display='none';if(selected===step){step++;updateHUD();showToast(step===6?'🎉 Prothese klaar! Opdracht voltooid.':'✅ Werkstap voltooid!');if(step===6)done=true}else showToast('Volg eerst de huidige opdracht')};function showToast(s){toast=s;toastUntil=performance.now()+2400}

let sky=ctx.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#10263f');sky.addColorStop(1,'#42617b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H/2);let floor=ctx.createLinearGradient(0,H/2,0,H);floor.addColorStop(0,'#263e4d');floor.addColorStop(1,'#0c1620');ctx.fillStyle=floor;ctx.fillRect(0,H/2,W,H/2);const FOV=Math.PI/2.6,cols=Math.ceil(W/3),cw=W/cols,depth=[];for(let i=0;i<cols;i++){let ray=angle+Math.atan((2*i/cols-1)*Math.tan(FOV/2));let rx=Math.cos(ray),ry=Math.sin(ray),dist=0;while(dist<24&&!solid(px+rx*dist,py+ry*dist))dist+=.035;let corrected=dist*Math.cos(ray-angle),height=Math.min(H*2,H/(corrected*.72)),hitx=px+rx*dist,hity=py+ry*dist;let edge=Math.min(hitx%1,1-hitx%1,hity%1,1-hity%1);let shade=Math.max(22,135-dist*12);ctx.fillStyle=`rgb(${shade*.51|0},${shade*.76|0},${shade|0})`;ctx.fillRect(i*cw,H/2-height/2,cw+1,height);if(edge<.035){ctx.fillStyle='#92d5ee33';ctx.fillRect(i*cw,H/2-height/2,cw+1,height)}depth[i]=corrected}

ctx.strokeStyle='#ffffff99';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-7,H/2);ctx.lineTo(W/2+7,H/2);ctx.moveTo(W/2,H/2-7);ctx.lineTo(W/2,H/2+7);ctx.stroke();if(near>=0){ctx.fillStyle='#c5f6ff';ctx.textAlign='center';ctx.font='bold 15px system-ui';ctx.fillText('ACTIE: '+machines[near].name,W/2,H*.74)}if(t<toastUntil){document.getElementById('toast').textContent=toast}else document.getElementById('toast').textContent='';requestAnimationFrame(render)}requestAnimationFrame(render);
